name: Update YouTube video catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: youtube-video-catalog
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Fetch public playlist feed
        run: node scripts/update-youtube-videos.mjs
      - name: Commit catalog when changed
        run: |
          if git diff --quiet -- youtube-videos.json; then
            echo "No catalog changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add youtube-videos.json
          git commit -m "chore: update YouTube video catalog"
          git push
